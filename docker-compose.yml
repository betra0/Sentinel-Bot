services:
 


  ds:
    build:
      context: ./backend/discordBot
      dockerfile: Dockerfile        
    restart: unless-stopped               
    environment:
      - BOTDSTOKEN=${BOTDSTOKEN}  
      - INTENTSDS=${INTENTSDS}     
      - REDISHOST=redis           
      - REDISPORT=6379             
    depends_on: 
      - redis    
    volumes:
    - ./backend/ticket-history:/app/data/ticket-history
    networks:
      - back-network

  redis:
     image: redis:latest
     restart: unless-stopped
     command: ["redis-server", "--appendonly", "yes"]
     ports:
        - "6383:6379"
     volumes:
       - redis_data:/data
     networks:
       - back-network
  

    
    

networks:
  back-network:
    driver: bridge

volumes:
  redis_data:
